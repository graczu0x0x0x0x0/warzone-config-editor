[project]
name = "warzone-config-editor"
dynamic = ["version"]
description = "GUI editor for Call of Duty: Black Ops 7 / Warzone PC settings files"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials>=6.8",  # GUI (stage 3+); Essentials avoids ~300 MB of WebEngine add-ons
    "psutil>=6.0",    # game process detection, later hardware detection
]

[project.scripts]
wzce = "wzce.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.3",
    "pytest-qt>=4.5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wzce/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wzce"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# The machine intercepts TLS (UnknownIssuer from pypi.org); trust the Windows cert store.
native-tls = true

[tool.ruff.lint.per-file-ignores]
# The Qt stylesheet is CSS inside an f-string; wrapping its rules hurts readability.
"src/wzce/ui/theme.py" = ["E501"]
# Embedded PowerShell script (CIM queries) is kept as one readable block.
"src/wzce/core/system_info.py" = ["E501"]
